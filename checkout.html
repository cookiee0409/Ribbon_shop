<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RIBONNE | 결제하기</title>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap');
  :root { --rose:#E0607E; --rose-dark:#C44E6B; --ink:#44343A; --gray:#8C7B82; --cream:#FBEFEF; --line:#F0DEDE; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif; color:var(--ink);
    background: radial-gradient(1200px 600px at 70% -10%, #F8DDE2 0%, transparent 60%), linear-gradient(180deg,#FBF3EF,#FAEDED);
    min-height:100vh; padding:30px 16px;
  }
  .serif { font-family:'Gowun Batang', serif; }
  .wrap { max-width:560px; margin:0 auto; }
  .topline { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand { font-size:22px; letter-spacing:3px; font-weight:700; color:var(--ink); text-decoration:none; }
  .brand .mid { color:var(--rose); }
  .back { color:var(--gray); text-decoration:none; font-size:14px; }
  .back:hover { color:var(--rose); }
  .card { background:#fff; border-radius:24px; padding:26px; box-shadow:0 18px 40px rgba(150,90,100,.10); border:1px solid var(--line); margin-bottom:18px; }
  h1 { font-size:24px; font-weight:700; margin-bottom:18px; }
  .summary { background:var(--cream); border-radius:16px; padding:18px; margin-bottom:6px; }
  .summary .row { display:flex; justify-content:space-between; padding:7px 0; font-size:14px; color:var(--gray); }
  .summary .row.total { border-top:1px dashed var(--line); margin-top:6px; padding-top:12px; }
  .summary .row.total .v { font-size:22px; font-weight:700; font-family:'Gowun Batang'; color:var(--rose); }
  .summary .row .v { color:var(--ink); }
  #payment-method, #agreement { margin-top:6px; }
  .pay-btn {
    width:100%; padding:17px; border-radius:16px; border:none; background:var(--rose); color:#fff;
    font-size:17px; cursor:pointer; font-family:inherit; margin-top:8px;
    box-shadow:0 12px 24px rgba(224,96,126,.32); transition:transform .15s;
  }
  .pay-btn:hover { transform:translateY(-2px); }
  .pay-btn:disabled { background:#E6CDD3; cursor:not-allowed; transform:none; box-shadow:none; }
  .empty { text-align:center; color:var(--gray); padding:50px 20px; }
  .empty a { color:var(--rose); }
  .hint { font-size:12.5px; color:var(--gray); text-align:center; margin-top:14px; line-height:1.7; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topline">
      <a href="index.html" class="brand">RI<span class="mid">BON</span>NE</a>
      <a href="index.html" class="back">← 쇼핑 계속하기</a>
    </div>

    <div id="content">
      <!-- 주문 정보가 있으면 결제 UI, 없으면 안내 -->
    </div>
  </div>

<script>
  var TOSS_CLIENT_KEY = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm"; // 결제위젯 문서용 테스트 키
  var won = function(v){ return Number(v).toLocaleString("ko-KR") + "원"; };

  // 1) 주문 정보 불러오기
  var order = null;
  try { order = JSON.parse(sessionStorage.getItem("ribonne_order")); } catch(e) {}

  var content = document.getElementById("content");

  if (!order || !order.amount) {
    // 주문 정보가 없으면 (직접 들어온 경우)
    content.innerHTML = '<div class="card"><div class="empty">주문 정보가 없어요.<br><a href="index.html">쇼핑몰로 돌아가서</a> 상품을 담아주세요 🎀</div></div>';
  } else {
    // 결제 화면 구성
    content.innerHTML =
      '<div class="card">' +
        '<h1 class="serif">주문 확인</h1>' +
        '<div class="summary">' +
          '<div class="row"><span>주문 상품</span><span class="v">' + order.orderName + '</span></div>' +
          '<div class="row"><span>상품 수량</span><span class="v">' + (order.count || 1) + '개</span></div>' +
          '<div class="row total"><span>총 결제금액</span><span class="v">' + won(order.amount) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h1 class="serif">결제 수단</h1>' +
        '<div id="payment-method"></div>' +
        '<div id="agreement"></div>' +
        '<button class="pay-btn" id="payBtn" disabled>결제 준비 중…</button>' +
        '<p class="hint">🎀 테스트 결제예요. 실제로 돈이 빠져나가지 않아요.<br>결제창에서 안내하는 테스트 카드로 진행해 보세요.</p>' +
      '</div>';

    renderWidget(order);
  }

  // 2) 토스 결제위젯 렌더링
  async function renderWidget(order){
    var payBtn = document.getElementById("payBtn");

    if (typeof TossPayments === "undefined"){
      payBtn.textContent = "결제 모듈 로드 실패";
      return;
    }

    try {
      var tossPayments = TossPayments(TOSS_CLIENT_KEY);
      // 비회원 결제
      var widgets = tossPayments.widgets({ customerKey: TossPayments.ANONYMOUS });

      // 금액 설정 (렌더 전에 반드시 호출)
      await widgets.setAmount({ currency: "KRW", value: order.amount });

      // 결제수단 UI + 약관 UI 렌더링
      await Promise.all([
        widgets.renderPaymentMethods({ selector: "#payment-method", variantKey: "DEFAULT" }),
        widgets.renderAgreement({ selector: "#agreement", variantKey: "AGREEMENT" })
      ]);

      // 준비 완료 → 버튼 활성화
      payBtn.disabled = false;
      payBtn.textContent = won(order.amount) + " 결제하기";

      // 3) 결제 요청
      payBtn.addEventListener("click", async function(){
        var baseDir = window.location.pathname.replace(/[^/]*$/, "");
        var baseUrl = window.location.origin + baseDir;
        try {
          await widgets.requestPayment({
            orderId: order.orderId,
            orderName: order.orderName,
            successUrl: baseUrl + "payment-success.html",
            failUrl: baseUrl + "payment-fail.html",
            customerName: "테스트 주문자"
          });
        } catch (err) {
          console.error("[결제 오류]", err);
          var code = (err && err.code) ? err.code : "";
          if (code === "USER_CANCEL"){
            // 사용자가 결제창을 닫음 - 조용히 무시
          } else {
            alert("결제 오류" + (code ? " ["+code+"]" : "") + ": " + (err && err.message ? err.message : "알 수 없는 오류"));
          }
        }
      });
    } catch (err) {
      console.error("[위젯 렌더 오류]", err);
      payBtn.textContent = "결제 UI 로드 실패 (콘솔 확인)";
    }
  }
</script>
</body>
</html>
