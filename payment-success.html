<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RIBONNE | 결제 성공</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap');
  :root { --rose:#E0607E; --ink:#44343A; --gray:#8C7B82; --cream:#FBEFEF; --line:#F0DEDE; --mint:#5BB89A; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Gowun Dodum','Apple SD Gothic Neo',sans-serif; color:var(--ink);
    background: radial-gradient(1200px 600px at 70% -10%, #F8DDE2 0%, transparent 60%), linear-gradient(180deg,#FBF3EF,#FAEDED);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .serif { font-family:'Gowun Batang', serif; }
  .card { background:#fff; border-radius:28px; padding:42px 36px; max-width:480px; width:100%; box-shadow:0 24px 50px rgba(150,90,100,.14); border:1px solid var(--line); text-align:center; }
  .check { width:76px; height:76px; border-radius:9999px; background:#E7F6F0; display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  h1 { font-size:27px; font-weight:700; margin-bottom:10px; }
  .sub { color:var(--gray); font-size:15px; line-height:1.7; margin-bottom:26px; }
  .info { background:var(--cream); border-radius:18px; padding:20px; text-align:left; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; font-size:13.5px; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--gray); flex-shrink:0; }
  .row .v { color:var(--ink); word-break:break-all; text-align:right; font-family:'Gowun Batang'; }
  .row .v.amount { color:var(--rose); font-weight:700; font-size:17px; }
  .note { background:#FFF8E8; border:1px solid #F3E6BD; border-radius:16px; padding:15px 17px; font-size:12.5px; color:#9A7B3A; line-height:1.7; text-align:left; margin-bottom:24px; }
  .note b { color:#7A5E1E; }
  .btn { display:inline-block; width:100%; padding:16px; border-radius:16px; border:none; background:var(--rose); color:#fff; font-size:16px; cursor:pointer; font-family:inherit; text-decoration:none; box-shadow:0 10px 20px rgba(224,96,126,.32); }
  .err { color:var(--rose); }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5BB89A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 class="serif">결제 인증 성공! 🎀</h1>
    <p class="sub">테스트 결제창 인증이 완료됐어요.<br>아래는 토스페이먼츠에서 전달받은 결제 정보예요.</p>

    <div class="info" id="info"></div>

    <div class="note">
      <b>💡 다음 단계 (실제 서비스에서)</b><br>
      여기 표시된 <b>paymentKey · orderId · amount</b> 값을 내 서버로 보내고,
      서버에서 시크릿 키로 <b>결제 승인 API</b>를 호출해야 진짜 결제가 완료돼요.
      시크릿 키는 브라우저에 두면 안 되기 때문에, 승인 단계는 서버가 필요해요.
      지금은 테스트라 인증까지만 확인하는 단계예요.
    </div>

    <a href="ribonne-final.html" class="btn">쇼핑 계속하기 →</a>
  </div>

<script>
  // 결제창에서 successUrl 로 넘어오면 쿼리 파라미터로 결과가 전달돼요.
  var params = new URLSearchParams(window.location.search);
  var paymentKey = params.get("paymentKey");
  var orderId = params.get("orderId");
  var amount = params.get("amount");

  var box = document.getElementById("info");

  if (paymentKey && orderId && amount) {
    // 보안 확인: 요청할 때 저장해둔 금액과 결제창이 돌려준 금액이 같은지 검증
    var saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("ribonne_order")); } catch(e) {}
    var amountMatch = saved && String(saved.amount) === String(amount);

    box.innerHTML =
      '<div class="row"><span class="k">주문번호</span><span class="v">' + orderId + '</span></div>' +
      '<div class="row"><span class="k">결제 금액</span><span class="v amount">' + Number(amount).toLocaleString("ko-KR") + '원</span></div>' +
      '<div class="row"><span class="k">paymentKey</span><span class="v">' + paymentKey + '</span></div>' +
      '<div class="row"><span class="k">금액 검증</span><span class="v">' + (amountMatch ? '✅ 일치' : '⚠️ 확인 필요') + '</span></div>';
  } else {
    box.innerHTML = '<p class="err">결제 정보를 찾을 수 없어요. 결제 페이지에서 다시 시도해 주세요.</p>';
  }
</script>
</body>
</html>
